<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeadGen — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0c; --panel: #111114; --panel-2: #16161a; --border: #222228; --border-strong: #2e2e37;
      --text: #ededf0; --text-2: #a1a1ab; --accent: #7c6cff; --accent-ring: rgba(124,108,255,.35); --red: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
      background: radial-gradient(1200px 600px at 50% -10%, rgba(124,108,255,.12), transparent 60%), var(--bg);
      color: var(--text); font-family: Inter, system-ui, sans-serif;
    }
    .card {
      width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--border);
      border-radius: 16px; padding: 32px 28px; box-shadow: 0 24px 64px -12px rgba(0,0,0,.7);
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
    .mark {
      width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
      background: var(--accent); color: #fff; font-size: 18px; box-shadow: inset 0 1px 0 rgba(255,255,255,.2);
    }
    .brand span { font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
    h1 { font-size: 16px; margin: 0 0 4px; }
    p.sub { font-size: 13px; color: var(--text-2); margin: 0 0 20px; }
    label { display: block; font-size: 12.5px; color: var(--text-2); margin-bottom: 6px; }
    input {
      width: 100%; height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border-strong);
      background: var(--panel-2); color: var(--text); font-size: 14px; font-family: inherit;
    }
    input:focus { outline: none; box-shadow: 0 0 0 3px var(--accent-ring); border-color: var(--accent); }
    button {
      width: 100%; height: 42px; margin-top: 16px; border: none; border-radius: 10px; cursor: pointer;
      background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; font-family: inherit;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.18);
    }
    button:disabled { opacity: .6; cursor: default; }
    .err { margin-top: 14px; font-size: 13px; color: var(--red); min-height: 18px; }
  </style>
</head>
<body>
  <form class="card" id="form" autocomplete="on">
    <div class="brand"><div class="mark">⚡</div><span>LeadGen</span></div>
    <h1 id="t-title">Sign in</h1>
    <p class="sub" id="t-sub">This dashboard is password-protected.</p>
    <label for="pw" id="t-label">Password</label>
    <input type="password" id="pw" name="password" autocomplete="current-password" autofocus required />
    <button type="submit" id="btn">Sign in</button>
    <div class="err" id="err"></div>
  </form>
  <script>
    // Match the dashboard's language choice if one was saved.
    try {
      if (localStorage.getItem('lang') === 'nl') {
        document.documentElement.lang = 'nl';
        document.getElementById('t-title').textContent = 'Inloggen';
        document.getElementById('t-sub').textContent = 'Dit dashboard is met een wachtwoord beveiligd.';
        document.getElementById('t-label').textContent = 'Wachtwoord';
        document.getElementById('btn').textContent = 'Inloggen';
      }
    } catch (e) {}
    var nl = document.documentElement.lang === 'nl';
    var form = document.getElementById('form'), btn = document.getElementById('btn'), err = document.getElementById('err');
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      err.textContent = '';
      btn.disabled = true;
      try {
        var res = await fetch('/api/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('pw').value }),
        });
        if (res.ok) { window.location.href = '/'; return; }
        err.textContent = nl ? 'Onjuist wachtwoord.' : 'Incorrect password.';
      } catch (e2) {
        err.textContent = nl ? 'Kon niet inloggen. Probeer opnieuw.' : 'Could not sign in. Try again.';
      }
      btn.disabled = false;
      document.getElementById('pw').select();
    });
  </script>
</body>
</html>
